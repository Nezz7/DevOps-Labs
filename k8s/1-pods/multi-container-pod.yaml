apiVersion: v1
kind: Pod
metadata:
  name: multi-container-pod
  labels:
    class: 3rd
spec:
  containers:
  - name: nginx
    image: nginx:latest
    ports:
    - containerPort: 80
  - name: ubuntu
    image: ubuntu:latest
    command: ['sh', '-c', 'while true; do echo "Server is running"; sleep 30; done']
